# Render Blueprint: creates the PostgreSQL database and the backend API in one go.
# Render dashboard → New → Blueprint → pick this repo.
databases:
  - name: taskly-db
    plan: free
    databaseName: taskmanager
    user: taskly

services:
  - type: web
    name: taskly-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: taskly-db
          property: connectionString # internal URL, no SSL needed inside Render
      - key: DATABASE_SSL
        value: "false"
      - key: CORS_ORIGIN
        sync: false # Render asks you for this: your Vercel URL, e.g. https://taskly.vercel.app
